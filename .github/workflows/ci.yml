name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows agent + core tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel
      - name: Build
        run: cmake --build build
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      # Browser tabs bridge on real Windows: native-messaging host + per-user pipe + agent side.
      - name: Browser tabs bridge e2e
        run: build/agent-windows/tabs-e2e/Archon.exe
      - name: Build browser extension
        run: node browser-extension/build.mjs
      # The Archon window over a made-up mixer, every state, as PNGs.
      - name: Window screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $exe = "build/agent-windows/archon_window_demo.exe"
          # A windowed program: wait for each run and fail on its exit code.
          function shot([string[]]$a) {
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "screenshot failed: $a" }
          }
          shot @("--shot", "shots/win-mixer.png")
          shot @("--shot", "shots/win-mixer-1280.png", "--size", "1280x800")
          shot @("--shot", "shots/win-narrow.png", "--size", "420x760")
          shot @("--shot", "shots/win-profiles.png", "--panel", "profiles")
          shot @("--shot", "shots/win-editor.png", "--panel", "editor")
          shot @("--shot", "shots/win-editor-auto.png", "--panel", "editor-auto")
          shot @("--shot", "shots/win-settings.png", "--panel", "settings")
          shot @("--shot", "shots/win-focus.png", "--focus", "3")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archon-windows-screenshots
          path: shots/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archon-windows
          path: |
            build/agent-windows/Archon.exe
            build/agent-windows/archon-tabs-host.exe
            build/archon-cli.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archon-browser-extension
          path: |
            browser-extension/dist/*.zip

  linux:
    name: Core tests (Linux, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Core tests
        run: ctest --test-dir build --output-on-failure

  android:
    name: Android app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runners ship the Android SDK (ANDROID_HOME) with accepted licenses;
      # Gradle installs the pinned NDK/CMake on demand.
      - name: Build APK and render screenshots
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --console=plain
        env:
          ARCHON_SHOTS: ${{ github.workspace }}/apps/android/app/build/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archon-android
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/app/build/screenshots/*.png

  ios:
    name: iOS app (simulator build) + core tests on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Core tests (Apple clang)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
        working-directory: apps/ios
      - name: Build for simulator
        working-directory: apps/ios
        run: >
          xcodebuild -project Archon.xcodeproj -scheme Archon -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build
      - name: Build for device (unsigned)
        working-directory: apps/ios
        run: >
          xcodebuild -project Archon.xcodeproj -scheme Archon -configuration Release
          -sdk iphoneos -destination "generic/platform=iOS"
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned .ipa (sign it with your own Apple ID, e.g. Sideloadly)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          APP=build/device/Build/Products/Release-iphoneos/Archon.app
          test -x "$APP/Archon"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Archon-unsigned.ipa Payload)
          ls -l Archon-unsigned.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archon-ios-ipa-unsigned
          path: apps/ios/Archon-unsigned.ipa
      - name: Screenshots (iPhone 16 Plus simulator, same size as iPhone 14 Plus)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild -project Archon.xcodeproj -scheme Archon -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 16 Plus" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build | tail -n 5
          APP=$(find build/dd -path "*Debug-iphonesimulator/Archon.app" -maxdepth 6 | head -1)
          UDID=$(xcrun simctl create archon-shots "iPhone 16 Plus")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shoot() {
            xcrun simctl terminate "$UDID" dev.archon.app || true
            xcrun simctl launch "$UDID" dev.archon.app -ArchonDemo "$1"
            sleep 4
            xcrun simctl io "$UDID" screenshot "shots/ios-$2.png"
          }
          for s in computers pairing pairing-wrong mixer reconnecting notrecognized panic listen tabs profiles; do shoot "$s" "$s"; done
          xcrun simctl ui "$UDID" content_size accessibility-extra-large
          for s in computers mixer pairing; do shoot "$s" "$s-axl"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archon-ios-screenshots
          path: apps/ios/shots/*.png
