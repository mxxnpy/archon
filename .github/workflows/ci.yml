name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows agent + core tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel
      - name: Build
        run: cmake --build build
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: archon-windows
          path: |
            build/agent-windows/Archon.exe
            build/archon-cli.exe

  linux:
    name: Core tests (Linux, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Core tests
        run: ctest --test-dir build --output-on-failure

  android:
    name: Android app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runners ship the Android SDK (ANDROID_HOME) with accepted licenses;
      # Gradle installs the pinned NDK/CMake on demand.
      - name: Build APK and render screenshots
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --console=plain
        env:
          ARCHON_SHOTS: ${{ github.workspace }}/apps/android/app/build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: archon-android
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/app/build/screenshots/*.png

  ios:
    name: iOS app (simulator build) + core tests on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests (Apple clang)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
        working-directory: apps/ios
      - name: Build for simulator
        working-directory: apps/ios
        run: >
          xcodebuild -project Archon.xcodeproj -scheme Archon -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build
      - name: Build for device (unsigned)
        working-directory: apps/ios
        run: >
          xcodebuild -project Archon.xcodeproj -scheme Archon -configuration Release
          -sdk iphoneos -destination "generic/platform=iOS"
          CODE_SIGNING_ALLOWED=NO build
      - name: Screenshots (iPhone 16 Plus simulator, same size as iPhone 14 Plus)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild -project Archon.xcodeproj -scheme Archon -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 16 Plus" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build | tail -n 5
          APP=$(find build/dd -path "*Debug-iphonesimulator/Archon.app" -maxdepth 6 | head -1)
          UDID=$(xcrun simctl create archon-shots "iPhone 16 Plus")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shoot() {
            xcrun simctl terminate "$UDID" dev.archon.app || true
            xcrun simctl launch "$UDID" dev.archon.app -ArchonDemo "$1"
            sleep 4
            xcrun simctl io "$UDID" screenshot "shots/ios-$2.png"
          }
          for s in computers pairing pairing-wrong mixer reconnecting notrecognized; do shoot "$s" "$s"; done
          xcrun simctl ui "$UDID" content_size accessibility-extra-large
          for s in computers mixer pairing; do shoot "$s" "$s-axl"; done
      - uses: actions/upload-artifact@v4
        with:
          name: archon-ios-screenshots
          path: apps/ios/shots/*.png
